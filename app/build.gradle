plugins {
    id "com.android.application" version "8.7.0"
}

android {
    namespace "com.anland.termux"
    compileSdk 36

    signingConfigs {
        termuxGitHub {
            storeFile rootProject.file("testkey_untrusted.jks")
            keyAlias "alias"
            storePassword "xrj45yWGLbsO7W0v"
            keyPassword "xrj45yWGLbsO7W0v"
        }
    }

    defaultConfig {
        applicationId "com.anland.termux"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }
    }

    ndkVersion "29.0.13113456"

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.termuxGitHub
        }
        release {
            signingConfig signingConfigs.termuxGitHub
            minifyEnabled false
        }
    }
}
